# Warhammer Collection Tracker on bastion (Jetson TX2), behind the existing
# Cloudflare Tunnel.
#
#   cp .env.example .env      # then edit SESSION_SECRET, OWNER_*, TIMEZONE
#   docker compose up -d --build
#   docker compose exec tracker python3 scripts/fetch_bsdata.py
#   docker compose exec tracker python3 scripts/import_bsdata.py
#
# The tunnel supplies HTTPS, which getUserMedia requires — barcode scanning
# will not work over plain http on a Tailscale IP.
#
# `version` is obsolete to Compose v2, which warns about it and carries on. It
# is REQUIRED by the standalone docker-compose v1 still shipping on Ubuntu
# 20.04, which without it falls back to the legacy format, reads `services` as
# a service name, and dies on "Unsupported config option". bastion runs 20.04,
# so it stays.
#
# 3.3 rather than something newer: bastion's docker-compose rejected 3.8
# outright. 3.3 has been supported since docker-compose 1.14 and by every
# Compose v2, and nothing here needs a later schema — the one directive that
# did (healthcheck.start_period, which needs 3.4) is gone, and costs little,
# since the first check does not run until interval has elapsed by which time
# the app is up.
version: '3.3'

services:
  tracker:
    build: .
    image: hobby-tracker:latest
    container_name: hobby-tracker
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
    volumes:
      - ./data:/app/data      # SQLite DB + the fetched BSData checkout
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:3100/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
