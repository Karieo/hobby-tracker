# Which 40,000 faction each Kill Team belongs to — the reviewed table.
#
# ────────────────────────────────────────────────────────────────────────
# THIS FILE IS A REVIEWED DECISION, NOT AN INFERENCE.
#
# The importer already derives what it can from the catalogues themselves
# (`resolve_factions` reads the category entries the 2024 game system
# defines). That reaches 34 teams and stops, because an alliance like
# `Imperium` covers nineteen teams while naming no faction, and the 2021
# catalogues carry no categories at all.
#
# The rest cannot be inferred, and writing them from a model's recall is the
# one change to this repo that would do real damage — fluent, plausible, and
# wrong in places with no signal about which. So they are not inferred here
# either. This table came from Clay, who reviewed it and handed it over.
#
# Two entries below correct the derivation rather than extend it, and both
# are the reviewed answer winning over the inferred one:
#   Hand of the Archon  category rule said Aeldari   -> Drukhari
#   Brood Brothers      category rule said Tyranids  -> Genestealer Cults
#
# Anything this file names that the importer cannot match — a team with no
# catalogue, a faction with no row — is reported and written to
# `unresolved_imports`. Nothing here is quietly dropped and nothing is
# quietly guessed.
# ────────────────────────────────────────────────────────────────────────

# Provenance travels with the data. The importer refuses to run without it.
source:
  retrieved_on: 2026-08-24
  confidence: high
  reviewed_by: Clay
  note: >
    Supplied by Clay as a reviewed table of the bespoke Kill Team teams for
    the 2024 edition. The 2021 Compendium teams are legacy and are not
    covered here; they stay on their own rows and are named in the report.

# `name` is the team as Clay names it. `catalogue` is only needed when the
# BSData catalogue spells it differently by more than a plural — the importer
# tolerates singular/plural on its own (Novitiate/Novitiates,
# Legionary/Legionaries), so an entry here means a genuinely different name.
#
# `alliance` and `subfaction` are carried for provenance and are not consumed:
# there is no column for either, and inventing one to hold them would be a
# schema decision rather than a data one.
