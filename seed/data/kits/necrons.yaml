# Boxed set contents, derived from published sources. Never from memory.
#
# Read seed/data/README-derived.md before adding to this file. The short
# version, because getting it wrong is the one change to this repo that does
# real damage:
#
#   * Every entry carries `sources`. The importer refuses entries without them.
#   * A `barcode` needs TWO independent sources agreeing. One retailer listing
#     is not enough — Combat Patrol: Orks exists as a 2021 box and a 2024 box
#     with completely different contents, and a barcode attached to the wrong
#     year silently corrupts ownership and purchase advice for months.
#   * An entry with no corroborated barcode still ships. It is reachable by
#     name from the review screen's dropdown, which is most of the value; the
#     barcode only buys the automatic suggestion.
#   * Unit names must match BSData exactly. The importer resolves every line
#     against the imported datasheets and writes anything it cannot match to
#     `unresolved_imports` — never guessed, never dropped.

kits:
