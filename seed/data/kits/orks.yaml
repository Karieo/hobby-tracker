# Boxed set contents, derived from published sources. Never from memory.
#
# Read seed/data/README-derived.md before adding to this file. The short
# version, because getting it wrong is the one change to this repo that does
# real damage:
#
#   * Every entry carries `sources`. The importer refuses entries without them.
#   * A `barcode` needs TWO independent sources agreeing. One retailer listing
#     is not enough — Combat Patrol: Orks exists as a 2021 box and a 2024 box
#     with completely different contents, and a barcode attached to the wrong
#     year silently corrupts ownership and purchase advice for months.
#   * An entry with no corroborated barcode still ships. It is reachable by
#     name from the review screen's dropdown, which is most of the value; the
#     barcode only buys the automatic suggestion.
#   * Unit names must match BSData exactly. The importer resolves every line
#     against the imported datasheets and writes anything it cannot match to
#     `unresolved_imports` — never guessed, never dropped.

kits:
- name: 'Combat Patrol: Orks'
  year: 2024
  faction: orks
  barcode: '5011921204021'
  barcode_sources:
  - https://spiedagames.com/products/warhammer-40k-combat-patrol-orks-5011921204021
  - https://www.rarewaves.com/products/5011921204021-73-50-40k-orks-combat-patrol
  contents:
  - unit: Beastboss
    models: 1
  - unit: Squighog Boyz
    models: 4
  - unit: Bomb Squig
    models: 1
  - unit: Beast Snagga Boyz
    models: 20
  sources:
    urls:
    - https://spikeybits.com/40k-orks-combat-patrol-value-what-is-it-worth/
    - https://www.belloflostsouls.net/2024/04/warhammer-40k-combat-patrol-orks-pricing-breakdown-next-steps.html
    - https://ageofminiatures.com/combat-patrol-orks/
    retrieved_on: 2026-08-22
    confidence: high
    corroborated_by: 3
    note: 'Boxed as "Morgrim''s Butchas". Three sources agree on 26 miniatures: 1 Beastboss,
      4 Squighog Boyz with 1 Bomb Squig, 20 Beast Snagga Boyz.'
- name: 'Boarding Patrol: Orks'
  faction: orks
  contents:
  - unit: Boss Snikrot
    models: 1
  - unit: Kommandos
    models: 10
  - unit: Bomb Squig
    models: 1
  - unit: Beast Snagga Boyz
    models: 10
  - unit: Flash Gitz
    models: 5
  sources:
    urls:
    - https://www.fauxhammer.com/price-savings-breakdown/boarding-patrol-orks-price-value-and-savings-breakdown/
    - https://www.adeptusars.com/miniatures/boarding-patrol-orks
    retrieved_on: 2026-08-22
    confidence: medium
    corroborated_by: 2
    note: '28 miniatures. The sources also list a Distraction Grot alongside the Kommandos;
      it is left out because it is part of the Kommandos kit rather than a datasheet of its
      own, and inventing a line for it would be exactly the kind of plausible-but-wrong entry
      this file exists to prevent. Confidence medium: no corroborated barcode, and the Kommandos
      count is the one figure the sources state least consistently.'
