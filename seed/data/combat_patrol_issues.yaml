# Warhammer 40,000: Combat Patrol — the Hachette partwork, issues 1-90.
#
# ────────────────────────────────────────────────────────────────────────
# THIS FILE IS DELIBERATELY EMPTY OF ISSUE DATA.
#
# The contents belong here, derived from a published source and reviewed —
# never written from memory. A partwork list recalled rather than read would
# be fluent, plausible, and wrong in places with no signal about which, and
# it would be imported as trusted seed data covering the whole magazine
# collection. A missing issue costs two minutes at the review screen; a wrong
# one quietly corrupts ownership and purchase advice for months.
#
# See seed/data/README.md for where to get the data and how to fill this in.
# `python3 seed/combat_patrol_magazine.py --status` reports what is missing.
# ────────────────────────────────────────────────────────────────────────

# Provenance travels with the data, so a later "buy this" can be traced back
# to where the claim came from. The importer refuses to run without it.
source:
  retrieved_on:            # YYYY-MM-DD
  confidence:              # high | medium | low
  urls: []                 # every page the contents were taken from
  corroborated_by: []      # a second, independent source that agrees

# The nine Combat Patrols and four premium kits the 90 issues build up to.
# These come from the spec (§11) rather than from a web source, which is why
# they are here and the per-issue contents are not.
collections:
  space-marines:      {name: "Combat Patrol: Space Marines",      faction: space-marines}
  tyranids:           {name: "Combat Patrol: Tyranids",           faction: tyranids}
  aeldari:            {name: "Combat Patrol: Aeldari",            faction: aeldari}
  chaos-space-marines: {name: "Combat Patrol: Chaos Space Marines", faction: chaos-space-marines}
  orks:               {name: "Combat Patrol: Orks",               faction: orks}
  leagues-of-votann:  {name: "Combat Patrol: Leagues of Votann",  faction: leagues-of-votann}
  genestealer-cults:  {name: "Combat Patrol: Genestealer Cults",  faction: genestealer-cults}
  astra-militarum:    {name: "Combat Patrol: Astra Militarum",    faction: astra-militarum}
  world-eaters:       {name: "Combat Patrol: World Eaters",       faction: world-eaters}

  premium-brutalis:   {name: "Premium: Brutalis Dreadnought + Hive Tyrant",        premium: true}
  premium-daemon:     {name: "Premium: Daemon Prince + Howling Banshees",          premium: true}
  premium-thunderkyn: {name: "Premium: Brôkhyr Thunderkyn + Killa Kans",           premium: true}
  premium-broodcoven: {name: "Premium: GSC Broodcoven + Rogal Dorn Battle Tank",   premium: true}

# One entry per issue. Shape:
#
#   - issue: 43
#     collection: orks            # a key from `collections` above
#     contents:
#       - unit: Boyz              # must match a BSData datasheet exactly
#         models: 10
#
# A sprue split across several issues names them all, and the kit is attached
# to the last issue in the span — half a Maulerfiend is not a model you own:
#
#   - issue: 89
#     collection: chaos-space-marines
#     contents:
#       - unit: Maulerfiend
#         models: 1
#         spans: [89, 90]
#
# Issue 89 then yields no kit of its own and is reported as parts-only.
issues: []

# ────────────────────────────────────────────────────────────────────────
# THE FOUR PREMIUM KITS
#
# These DO ship with contents, because unlike the per-issue list they are
# documented in the spec (§11) rather than on a web page I could not reach.
# The spec is a reviewed source; my recall is not.
#
# `models: min` means "one minimum-size unit", resolved from the imported
# rules data at seed time rather than written down here. A premium kit
# delivers one legal unit, so the datasheet's minimum unit size is the count —
# and keeping it out of this file means the number can never drift from the
# rules.
#
# Two lines below deliberately will not match, and are left in rather than
# dropped, because a silently missing line is a shortfall you find at the till
# months later:
#
#   * "Daemon Prince" — BSData has no plain one. It is Daemon Prince of Chaos,
#     of Khorne, of Nurgle, with or without wings. Which one it becomes is a
#     build-time decision (§14: no potential-builds modelling), so it is yours
#     to make, not mine to guess.
#   * "GSC Broodcoven" — a three-character boxed set (Magus, Primus,
#     Patriarch), not one datasheet. Needs splitting into its three lines.
#
# Both are reported by the seeder and land in unresolved_imports with a
# manual picker, which is exactly what that machinery is for.
# ────────────────────────────────────────────────────────────────────────
premium_source:
  from: "warhammer-tracker-spec.md §11"
  retrieved_on: 2026-08-21
  confidence: medium
  note: >
    Unit names are the spec's, verbatim. Counts are the minimum legal unit size
    from the imported rules data, which is what one kit delivers — worth
    checking against the physical kit before trusting them.

premium_kits:
  premium-brutalis:
    owned: false          # set true for the ones you actually took
    contents:
      - {unit: Brutalis Dreadnought, models: min}
      - {unit: Hive Tyrant, models: min}
  premium-daemon:
    owned: false
    contents:
      - {unit: Daemon Prince, models: min}      # will not match — see above
      - {unit: Howling Banshees, models: min}
  premium-thunderkyn:
    owned: false
    contents:
      - {unit: Brôkhyr Thunderkyn, models: min}
      - {unit: Killa Kans, models: min}
  premium-broodcoven:
    owned: false
    contents:
      - {unit: GSC Broodcoven, models: min}     # will not match — see above
      - {unit: Rogal Dorn Battle Tank, models: min}
